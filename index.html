<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes"
    />
    <title>✨ mich · password generator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(145deg, #0b0e14 0%, #1a1f2a 100%);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        color: #eef2fb;
      }

      .pw-container {
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
      }

      .generator-card {
        background: rgba(18, 24, 33, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(74, 144, 226, 0.25);
        border-radius: 48px 48px 40px 40px;
        padding: 2.2rem 2rem;
        box-shadow:
          0 20px 40px -12px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        transition: all 0.2s ease;
      }

      .top-badge {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2.2rem;
        flex-wrap: wrap;
      }

      .title-group {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }

      .title-group i {
        font-size: 2.2rem;
        color: #ffb86b;
        filter: drop-shadow(0 0 6px #ffa34d88);
      }

      h1 {
        font-weight: 650;
        font-size: 1.9rem;
        letter-spacing: -0.01em;
        background: linear-gradient(120deg, #f0f9ff, #ffe0b9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .strength-badge {
        background: #1e2b3c;
        padding: 0.4rem 1.4rem;
        border-radius: 100px;
        border: 1px solid #b77f3e60;
        color: #ffd9a3;
        font-weight: 600;
        font-size: 0.85rem;
        display: flex;
        gap: 0.5rem;
        letter-spacing: 0.3px;
        backdrop-filter: blur(4px);
      }

      .pw-hero {
        background: #0c111b;
        border-radius: 28px;
        padding: 0.2rem;
        border: 1px solid #a67c4b;
        box-shadow: 0 8px 0 #06080c;
        margin-bottom: 2rem;
      }

      .pw-screen {
        background: #0b0f16;
        border-radius: 28px;
        padding: 1.8rem 1.8rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        border-bottom: 1px solid #b48b52;
      }

      #passwordOutput {
        font-family:
          "SF Mono", "Fira Code", "Cascadia Code", "Roboto Mono", monospace;
        font-size: 1.7rem;
        font-weight: 550;
        letter-spacing: 2px;
        color: #ffefd1;
        text-shadow: 0 0 12px #ffa60044;
        word-break: break-all;
        line-height: 1.4;
      }

      .action-buttons {
        display: flex;
        gap: 0.8rem;
      }

      .icon-btn {
        background: #1d2a36;
        border: none;
        color: #ffd9b0;
        width: 54px;
        height: 54px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        cursor: pointer;
        transition: 0.16s;
        border: 1px solid #b88b4b;
        box-shadow: 0 5px 0 #0e141c;
      }

      .icon-btn:hover {
        background: #2f3e4f;
        color: white;
        border-color: #ffb05b;
        transform: translateY(-2px);
        box-shadow: 0 7px 0 #0e141c;
      }

      .icon-btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #0e141c;
      }

      .options-panel {
        background: rgba(12, 22, 32, 0.6);
        border-radius: 28px;
        padding: 1.8rem 1.9rem;
        margin-bottom: 1.8rem;
        border: 1px solid #a67c4b;
        backdrop-filter: blur(10px);
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 600;
        margin-bottom: 1.4rem;
        color: #ffdcb5;
        font-size: 1.1rem;
      }

      .length-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 1.8rem;
      }

      .length-slider {
        flex: 2;
        min-width: 200px;
      }

      .length-slider input {
        width: 100%;
        height: 8px;
        background: #1c2b38;
        border-radius: 20px;
        appearance: none;
        outline: none;
        border: 1px solid #4f6f8a;
      }

      .length-slider input::-webkit-slider-thumb {
        appearance: none;
        width: 22px;
        height: 22px;
        background: #ffbd6e;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 10px #ffae3c;
        border: 2px solid #fff3d1;
      }

      .length-value {
        background: #16232e;
        padding: 0.5rem 1.4rem;
        border-radius: 40px;
        font-weight: 700;
        font-size: 1.3rem;
        border: 1px solid #c6944e;
        color: #ffeac2;
      }

      .char-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 0.9rem;
        margin-bottom: 2rem;
      }

      .char-option {
        background: #111c26;
        border: 1.5px solid #4f5d6e;
        border-radius: 30px;
        padding: 1rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.7rem;
        color: #d4e0f0;
        transition: all 0.15s;
        cursor: pointer;
        box-shadow: 0 3px 0 #0c131c;
      }

      .char-option i {
        font-size: 1.2rem;
        color: #ffbc6e;
        width: 24px;
      }

      .char-option span {
        font-weight: 500;
        flex: 1;
      }

      .char-option input {
        transform: scale(1.2);
        accent-color: #ffa53e;
        width: 22px;
        height: 22px;
        margin-left: auto;
      }

      .extra-features {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        align-items: center;
        justify-content: space-between;
      }

      .case-buttons {
        display: flex;
        gap: 0.6rem;
        background: #0e1a20;
        padding: 0.3rem;
        border-radius: 50px;
        border: 1px solid #b3864a;
      }

      .case-btn {
        background: transparent;
        border: none;
        color: #ffdbbd;
        font-weight: 600;
        padding: 0.5rem 1rem;
        border-radius: 40px;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        transition: 0.1s;
        cursor: pointer;
      }

      .case-btn.active-case {
        background: #a86923;
        color: white;
        box-shadow: 0 2px 0 #4f3219;
      }

      .history-area {
        background: rgba(5, 13, 19, 0.7);
        border-radius: 24px;
        padding: 1.4rem 1.7rem;
        backdrop-filter: blur(8px);
        border: 1px solid #b98f55;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .history-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        max-height: 110px;
        overflow-y: auto;
        padding: 0.2rem 0.1rem;
      }

      .history-item {
        background: #0e1d29;
        border-radius: 18px;
        padding: 0.55rem 1.2rem;
        font-family: monospace;
        font-size: 0.9rem;
        border-left: 4px solid #ff9f3d;
        color: #ffefd1;
        display: flex;
        align-items: center;
        gap: 0.7rem;
        box-shadow: 0 2px 6px #00000030;
        word-break: break-all;
      }

      .history-item i {
        color: #ffae4b;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .clear-history {
        background: none;
        border: 1px solid #b9813a;
        padding: 0.5rem 1.2rem;
        border-radius: 30px;
        color: #ffdcb1;
        font-weight: 500;
        transition: 0.1s;
        cursor: pointer;
      }

      .footnote {
        margin-top: 1.2rem;
        text-align: center;
        color: #bda27e;
        font-size: 0.75rem;
        opacity: 0.8;
      }

      @media (max-width: 550px) {
        .generator-card {
          padding: 1.5rem 1.2rem;
          border-radius: 32px;
        }
        .pw-screen {
          flex-direction: column;
          align-items: flex-start;
        }
        #passwordOutput {
          font-size: 1.25rem;
        }
        .title-group h1 {
          font-size: 1.6rem;
        }
      }

      .fa-regular,
      .fas,
      .far {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="pw-container">
      <div class="generator-card">
        <div class="top-badge">
          <div class="title-group">
            <i class="fas fa-lock"></i>
            <h1>mich·pw</h1>
          </div>
          <div class="strength-badge" id="strengthBadge">
            <i class="fas fa-shield"></i> <span id="strengthText">strong</span>
          </div>
        </div>

        <div class="pw-hero">
          <div class="pw-screen">
            <span id="passwordOutput">G7#k9pR!w2$L</span>
            <div class="action-buttons">
              <button class="icon-btn" id="copyBtn" title="Copy password">
                <i class="far fa-copy"></i>
              </button>
              <button class="icon-btn" id="refreshBtn" title="Generate new">
                <i class="fas fa-sync-alt"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="options-panel">
          <div class="section-label">
            <i class="fas fa-sliders"></i> <span>PASSWORD BUILDER</span>
          </div>

          <div class="length-row">
            <div style="display: flex; align-items: center; gap: 0.6rem">
              <i class="fas fa-arrows-left-right"></i> <span>length</span>
            </div>
            <div class="length-slider">
              <input
                type="range"
                id="lengthSlider"
                min="4"
                max="32"
                value="16"
                step="1"
              />
            </div>
            <div class="length-value" id="lengthDisplay">16</div>
          </div>

          <div class="char-grid" id="charPoolGrid">
            <label class="char-option"
              ><i class="fas fa-font"></i> <span>Uppercase A-Z</span>
              <input type="checkbox" id="includeUpper" checked
            /></label>
            <label class="char-option"
              ><i class="fas fa-small-a"></i> <span>Lowercase a-z</span>
              <input type="checkbox" id="includeLower" checked
            /></label>
            <label class="char-option"
              ><i class="fas fa-digit"></i> <span>Digits 0-9</span>
              <input type="checkbox" id="includeDigits" checked
            /></label>
            <label class="char-option"
              ><i class="fas fa-code"></i> <span>Symbols !@#$%</span>
              <input type="checkbox" id="includeSymbols" checked
            /></label>
            <label class="char-option"
              ><i class="fas fa-ellipsis"></i>
              <span>Similar chars (il1|0O)</span>
              <input type="checkbox" id="excludeSimilar"
            /></label>
          </div>

          <div class="extra-features">
            <div class="case-buttons" id="caseStyleGroup">
              <button id="lowerCaseBtn" class="case-btn active-case">
                <i class="fas fa-small-a"></i> prefer lower
              </button>
              <button id="upperCaseBtn" class="case-btn">
                <i class="fas fa-large-a"></i> prefer UPPER
              </button>
              <button id="mixedCaseBtn" class="case-btn">
                <i class="fas fa-random"></i> mixed
              </button>
            </div>
            <div style="color: #ffd9aa">
              <i class="fas fa-bolt"></i> click refresh
            </div>
          </div>
        </div>

        <div class="history-area">
          <div class="history-header">
            <span style="font-weight: 600; display: flex; gap: 6px"
              ><i class="fas fa-clock-rotate-left"></i> recent passwords</span
            >
            <button class="clear-history" id="clearHistoryBtn">
              <i class="fas fa-trash-alt"></i> clear
            </button>
          </div>
          <div class="history-list" id="historyList"></div>
        </div>
        <div class="footnote">
          <i class="fas fa-sparkles"></i> mich password generator v1
        </div>
      </div>
    </div>

    <script>
      (function () {
        const passwordEl = document.getElementById("passwordOutput");
        const strengthBadgeSpan = document.getElementById("strengthText");
        const lengthSlider = document.getElementById("lengthSlider");
        const lengthDisplay = document.getElementById("lengthDisplay");
        const includeUpper = document.getElementById("includeUpper");
        const includeLower = document.getElementById("includeLower");
        const includeDigits = document.getElementById("includeDigits");
        const includeSymbols = document.getElementById("includeSymbols");
        const excludeSimilar = document.getElementById("excludeSimilar");
        const lowerCaseBtn = document.getElementById("lowerCaseBtn");
        const upperCaseBtn = document.getElementById("upperCaseBtn");
        const mixedCaseBtn = document.getElementById("mixedCaseBtn");
        const refreshBtn = document.getElementById("refreshBtn");
        const copyBtn = document.getElementById("copyBtn");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");
        const historyListEl = document.getElementById("historyList");

        let currentPassword = "G7#k9pR!w2$L";
        let history = [];

        let casePreference = "mixed";

        const SIMILAR_SET = "il1|0O";
        const UPPER_SET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const LOWER_SET = "abcdefghijklmnopqrstuvwxyz";
        const DIGIT_SET = "0123456789";
        const SYMBOL_SET = "!@#$%^&*()_+[]{}<>?-=.,";

        function filterSimilarChars(str) {
          if (!excludeSimilar.checked) return str;
          return str
            .split("")
            .filter((ch) => !SIMILAR_SET.includes(ch))
            .join("");
        }

        function getAvailableCharset() {
          let charset = "";
          if (includeUpper.checked) charset += UPPER_SET;
          if (includeLower.checked) charset += LOWER_SET;
          if (includeDigits.checked) charset += DIGIT_SET;
          if (includeSymbols.checked) charset += SYMBOL_SET;

          if (charset === "") {
            charset = LOWER_SET;
          }

          charset = filterSimilarChars(charset);
          return charset;
        }

        function generatePassword() {
          let charset = getAvailableCharset();
          const length = parseInt(lengthSlider.value, 10);

          if (charset.length === 0) {
            charset = "abcdefghijkmnpqrstuvwxyz23456789";
          }

          let password = "";
          for (let i = 0; i < length; i++) {
            const randIdx = Math.floor(Math.random() * charset.length);
            password += charset[randIdx];
          }

          if (casePreference === "upper") {
            password = password.toUpperCase();
          } else if (casePreference === "lower") {
            password = password.toLowerCase();
          } else {
          }

          return password;
        }

        function evaluateStrength(pw) {
          const len = pw.length;
          let hasUpper = /[A-Z]/.test(pw);
          let hasLower = /[a-z]/.test(pw);
          let hasDigit = /[0-9]/.test(pw);
          let hasSymbol = /[^A-Za-z0-9]/.test(pw);
          let variety =
            (hasUpper ? 1 : 0) +
            (hasLower ? 1 : 0) +
            (hasDigit ? 1 : 0) +
            (hasSymbol ? 1 : 0);

          if (len >= 16 && variety >= 3) return "strong";
          if (len >= 10 && variety >= 2) return "good";
          if (len >= 6) return "ok";
          return "weak";
        }

        function updateStrengthIndicator() {
          const pw = passwordEl.textContent;
          const strength = evaluateStrength(pw);
          strengthBadgeSpan.textContent = strength;
          const badge = document.getElementById("strengthBadge");
          badge.style.borderColor =
            strength === "strong"
              ? "#5bb75b"
              : strength === "good"
                ? "#e8c35c"
                : "#b57c7c";
        }

        function refreshPassword() {
          const pw = generatePassword();
          currentPassword = pw;
          passwordEl.textContent = pw;
          addToHistory(pw);
          updateStrengthIndicator();
        }

        function addToHistory(pw) {
          if (history.length > 0 && history[0] === pw) return;
          history.unshift(pw);
          if (history.length > 6) history.pop();
          renderHistory();
        }

        function renderHistory() {
          if (!historyListEl) return;
          if (history.length === 0) {
            historyListEl.innerHTML =
              '<div style="color:#bda27e; font-style:italic; padding:0.4rem;">✨ generate some passwords</div>';
            return;
          }
          let html = "";
          history.forEach((pw) => {
            html += `<div class="history-item">
                  <i class="fas fa-copy copy-history" data-password="${pw.replace(/"/g, "&quot;")}"></i>
                  <span style="word-break:break-all;">${pw}</span>
                </div>`;
          });
          historyListEl.innerHTML = html;
          document.querySelectorAll(".copy-history").forEach((icon) => {
            icon.addEventListener("click", (e) => {
              const pw = icon.dataset.password;
              copyToClipboard(pw);
            });
          });
        }

        function copyToClipboard(text) {
          navigator.clipboard
            .writeText(text)
            .then(() => {
              passwordEl.style.color = "#b5ffb9";
              setTimeout(() => (passwordEl.style.color = ""), 200);
            })
            .catch(() => alert("copy failed"));
        }

        function syncCaseButtons() {
          lowerCaseBtn.classList.remove("active-case");
          upperCaseBtn.classList.remove("active-case");
          mixedCaseBtn.classList.remove("active-case");
          if (casePreference === "lower")
            lowerCaseBtn.classList.add("active-case");
          else if (casePreference === "upper")
            upperCaseBtn.classList.add("active-case");
          else mixedCaseBtn.classList.add("active-case");
        }

        lengthSlider.addEventListener("input", () => {
          lengthDisplay.textContent = lengthSlider.value;
        });

        refreshBtn.addEventListener("click", refreshPassword);

        copyBtn.addEventListener("click", () => {
          copyToClipboard(passwordEl.textContent);
        });

        includeUpper.addEventListener("change", refreshPassword);
        includeLower.addEventListener("change", refreshPassword);
        includeDigits.addEventListener("change", refreshPassword);
        includeSymbols.addEventListener("change", refreshPassword);
        excludeSimilar.addEventListener("change", refreshPassword);
        lengthSlider.addEventListener("change", refreshPassword);

        lowerCaseBtn.addEventListener("click", () => {
          casePreference = "lower";
          syncCaseButtons();
          refreshPassword();
        });
        upperCaseBtn.addEventListener("click", () => {
          casePreference = "upper";
          syncCaseButtons();
          refreshPassword();
        });
        mixedCaseBtn.addEventListener("click", () => {
          casePreference = "mixed";
          syncCaseButtons();
          refreshPassword();
        });

        clearHistoryBtn.addEventListener("click", () => {
          history = [];
          renderHistory();
        });

        function init() {
          casePreference = "mixed";
          syncCaseButtons();
          lengthDisplay.textContent = lengthSlider.value;
          includeUpper.checked = true;
          includeLower.checked = true;
          includeDigits.checked = true;
          includeSymbols.checked = true;
          excludeSimilar.checked = false;
          refreshPassword();
          history.unshift("@w9Zk!2rP");
          history.unshift("M8$t#fL3qX");
          if (history.length > 6) history = history.slice(0, 6);
          renderHistory();
        }

        init();
      })();
    </script>
  </body>
</html>
